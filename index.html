<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>おしてみて！ボタンあそび</title>
<!-- アプリ化（PWA）用 -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#fff8ec">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ボタンあそび">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none;
    font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", sans-serif;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    touch-action: manipulation; background: #fff8ec; color: #4a3b2a;
  }
  /* ノッチ・ホームバーをよける */
  :root { --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px); }
  .screen { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; }
  .screen.on { display: flex; }

  /* ---------- ホーム ---------- */
  #home { padding: calc(18px + var(--st)) 14px calc(18px + var(--sb)); overflow-y: auto; }
  #home h1 { font-size: clamp(26px, 7vw, 40px); margin: 6px 0 16px; letter-spacing: 2px; }
  #home h1 span { display: inline-block; animation: hop 1.6s infinite; }
  #home h1 span:nth-child(2n) { animation-delay: .2s; }
  @keyframes hop { 0%,60%,100% { transform: translateY(0) } 30% { transform: translateY(-8px) } }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: 100%; max-width: 520px; }
  .card {
    border: none; border-radius: 26px; padding: 16px 8px 14px; font: inherit; color: #fff;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    box-shadow: 0 7px 0 rgba(0,0,0,.18); transition: transform .08s;
  }
  .card:active { transform: translateY(5px); box-shadow: 0 2px 0 rgba(0,0,0,.18); }
  .card .ico { font-size: clamp(54px, 15vw, 76px); line-height: 1.1; }
  .card .nm { font-size: clamp(18px, 5vw, 24px); text-shadow: 0 2px 0 rgba(0,0,0,.15); }

  /* ---------- あそぶ画面 ---------- */
  #play { justify-content: space-between; gap: 14px; padding: calc(64px + var(--st)) 14px calc(28px + var(--sb)); transition: background .3s; }
  #back {
    position: absolute; top: calc(12px + var(--st)); left: 12px; border: none; border-radius: 999px;
    background: rgba(255,255,255,.85); font: inherit; font-size: 18px; padding: 10px 18px;
    color: #4a3b2a; box-shadow: 0 3px 0 rgba(0,0,0,.12); z-index: 30;
  }
  #display { flex: 1 1 auto; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
  #big {
    width: min(50vw, 200px, 25vh); height: min(50vw, 200px, 25vh); border-radius: 50%; border: 8px solid rgba(255,255,255,.7);
    font: inherit; font-size: clamp(22px, 6.5vw, 32px); color: #fff; letter-spacing: 1px; line-height: 1.2; padding: 0 10px;
    text-shadow: 0 3px 0 rgba(0,0,0,.2); position: relative; z-index: 5;
    box-shadow: 0 14px 0 var(--dark), 0 18px 30px rgba(0,0,0,.25), inset 0 -10px 0 rgba(0,0,0,.12), inset 0 10px 0 rgba(255,255,255,.25);
    transition: transform .07s, box-shadow .07s; background: var(--btn);
  }
  #big.down { transform: translateY(11px);
    box-shadow: 0 3px 0 var(--dark), 0 5px 10px rgba(0,0,0,.25), inset 0 -6px 0 rgba(0,0,0,.12), inset 0 8px 0 rgba(255,255,255,.25); }
  #big.glow { animation: glow .5s ease-in-out 4 alternate; }
  @keyframes glow { to { filter: brightness(1.35); } }
  #big.wiggle { animation: wiggle .3s; }
  @keyframes wiggle { 25% { transform: rotate(-6deg) } 75% { transform: rotate(6deg) } }
  #hint { font-size: 19px; opacity: .8; min-height: 28px; text-align: center; animation: hop 1.4s infinite; }

  /* ---------- 共通（手順ガイド） ---------- */
  #big.off { filter: grayscale(.85) brightness(1.05); opacity: .45; }
  #big.guide { animation: glow .7s ease-in-out infinite alternate; }
  .guide { outline: 4px dashed #ffb400; outline-offset: 5px; animation: gd .9s steps(1) infinite; }
  @keyframes gd { 50% { outline-color: transparent; } }
  .wiggle, #big.wiggle { animation: wiggle .3s; }
  .tb { border: none; font: inherit; color: #4a3b2a; background: #fff; border-radius: 14px; box-shadow: 0 4px 0 rgba(0,0,0,.15); }
  .tb:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.15); }
  .dim { opacity: .35; }

  /* レジ */
  .reji { width: min(100%, 360px); display: flex; flex-direction: column; gap: 8px; }
  .lcd { background: #1f3b2c; color: #7dffb0; border: 5px solid #555; border-radius: 12px; padding: 4px 14px;
    text-shadow: 0 0 8px #3fd07a; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; min-height: 52px; }
  #lcd1 { font-size: 20px; } #lcd2 { font-size: 30px; white-space: nowrap; }
  .tray { min-height: 46px; background: #fff; border: 3px dashed #f3c6b0; border-radius: 12px; font-size: 30px;
    display: flex; flex-wrap: wrap; justify-content: center; align-items: center; }
  .tray em { font-size: 16px; color: #c9a99a; font-style: normal; }
  .shelf { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .shelf.pay { grid-template-columns: repeat(3, 1fr); }
  .good { display: flex; flex-direction: column; align-items: center; padding: 4px 0 3px; }
  .good span { font-size: 44px; line-height: 1.15; } .good small { font-size: 14px; }
  .cash { padding: 8px 0; font-size: 18px; } .cash span { display: block; font-size: 38px; line-height: 1.2; }
  .receipt { background: #fff; border-radius: 6px; padding: 12px 22px 14px; box-shadow: 0 6px 16px rgba(0,0,0,.15);
    animation: slide .5s ease-out; min-width: 250px; border-bottom: 6px dashed #eee; }
  .receipt .items { font-size: 34px; text-align: center; }
  .receipt .row { display: flex; justify-content: space-between; font-size: 20px; gap: 18px; }
  .receipt .row.sum { font-size: 26px; color: #e64545; border-top: 2px dashed #ddd; margin-top: 4px; padding-top: 4px; }
  .receipt .ty { font-size: 18px; text-align: center; margin-top: 6px; }
  @keyframes slide { from { transform: translateY(-40px); opacity: 0 } to { transform: none; opacity: 1 } }

  /* ピンポン */
  .house { display: flex; gap: 18px; align-items: flex-end; }
  .monitor { width: 150px; height: 120px; background: #26323a; border-radius: 14px; border: 8px solid #9aa6ad;
    display: flex; align-items: center; justify-content: center; font-size: 72px; overflow: hidden; }
  .monitor .q { font-size: 22px; color: #789; }
  .monitor .who { animation: peek .6s ease-out; }
  @keyframes peek { from { transform: translateY(120px) } to { transform: none } }
  .doorway { width: 130px; height: 190px; background: #fdf3df; border: 8px solid #a0704a; border-bottom: none;
    border-radius: 8px 8px 0 0; position: relative; perspective: 500px; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-end; font-size: 64px; line-height: 1.1; }
  .doorway .gift { font-size: 40px; }
  .door { position: absolute; inset: 0; background: #c98b55; box-shadow: inset 0 0 0 6px #b0743f; transform-origin: left; transition: transform .8s; }
  .door::after { content: ''; position: absolute; right: 12px; top: 50%; width: 14px; height: 14px; border-radius: 50%; background: #ffd35c; }
  .door.open { transform: rotateY(-80deg); }

  /* バス */
  .bus { width: min(100%, 360px); display: flex; flex-direction: column; gap: 8px; }
  .led { background: #1b1b1b; color: #ffb233; border: 4px solid #555; border-radius: 10px; padding: 4px 12px;
    display: flex; align-items: baseline; gap: 10px; text-shadow: 0 0 8px #ff9d00; overflow: hidden; }
  .led small { font-size: 16px; white-space: nowrap; } .led b { font-size: 26px; white-space: nowrap; }
  .route { display: flex; position: relative; }
  .route::before { content: ''; position: absolute; left: 12%; right: 12%; top: 21px; height: 6px; background: #c9b6e8; border-radius: 3px; }
  .route div { position: relative; width: 25%; display: flex; flex-direction: column; align-items: center; font-size: 12px; text-align: center; }
  .route div span { width: 46px; height: 46px; border-radius: 50%; background: #fff; border: 3px solid #c9b6e8;
    display: flex; align-items: center; justify-content: center; font-size: 26px; }
  .route div.nx { font-weight: 800; color: #5f3a92; font-size: 13px; } .route div.nx span { border-color: #8e5bd1; background: #fff2a8; }
  .road { height: 86px; border-radius: 12px; position: relative; overflow: hidden; background: linear-gradient(#bfe6ff 0 62%, #8a8a8a 62%); }
  .road .scene { position: absolute; bottom: 30px; left: 0; white-space: nowrap; font-size: 34px; animation: scroll 5s linear infinite; }
  @keyframes scroll { to { transform: translateX(-50%) } }
  .road .me { position: absolute; left: 22%; bottom: 4px; font-size: 54px; line-height: 1; transform: scaleX(-1); }
  .road .me span { display: inline-block; animation: rattle .25s infinite alternate; }
  .road.stop .scene, .road.stop .me span { animation-play-state: paused; }
  .road .bs { position: absolute; right: 12%; bottom: 24px; font-size: 40px; opacity: 0; transition: opacity .5s; }
  .road .bs.show { opacity: 1; }
  .sign { background: #2b2233; color: #4e3d55; font-size: 26px; padding: 6px 12px; border-radius: 12px; text-align: center;
    border: 5px solid #6d5a78; letter-spacing: 3px; transition: all .2s; }
  .sign.lit { color: #ffd6f2; text-shadow: 0 0 12px #ff5fc8, 0 0 24px #ff5fc8; background: #4a1f45; }

  /* エレベーター */
  .elev { display: flex; gap: 14px; align-items: center; }
  .ecol { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .ind { background: #222; color: #ffb233; font-family: monospace; font-size: 40px; width: 130px; text-align: center;
    border-radius: 10px; border: 5px solid #c9c9c9; text-shadow: 0 0 10px #ff9d00; }
  .ind span { font-size: 24px; display: inline-block; width: 30px; }
  .cab { width: 150px; height: 165px; position: relative; overflow: hidden; background: #fff7e0; border: 8px solid #b8c0c8;
    border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .cab .ins { font-size: 68px; line-height: 1.1; } .cab .nm { font-size: 15px; }
  .cab .dl, .cab .dr { position: absolute; top: 0; bottom: 0; width: 50%; background: linear-gradient(90deg, #c7ced6, #e8ecef); transition: transform .6s; }
  .cab .dl { left: 0; transform: translateX(-100%); border-right: 2px solid #9aa4ad; }
  .cab .dr { right: 0; transform: translateX(100%); }
  .cab.closed .dl, .cab.closed .dr { transform: none; }
  .panel { background: #cfd6dd; padding: 12px; border-radius: 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .fb { width: 58px; height: 58px; border-radius: 50%; border: 4px solid #8d99a5; background: #f4f6f8; font: inherit;
    font-size: 24px; color: #4a3b2a; position: relative; }
  .fb small { position: absolute; right: -10px; bottom: -8px; font-size: 22px; }
  .fb.lit { background: #fff2a8; border-color: #ffb233; box-shadow: 0 0 12px #ffb233; }

  /* しんごう */
  .cross { width: min(100%, 340px); display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .cross .top { display: flex; gap: 14px; align-items: center; }
  .signal { display: flex; flex-direction: column; gap: 8px; background: #333; padding: 10px; border-radius: 16px; }
  .signal div { width: 90px; height: 66px; border-radius: 10px; background: #1b1b1b; font-size: 44px;
    display: flex; align-items: center; justify-content: center; opacity: .25; }
  .signal .r.on { background: #ff3b3b; opacity: 1; } .signal .g.on { background: #23d160; opacity: 1; }
  .signal .g.blink { animation: blink .35s steps(1) infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  .side { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .meter { display: flex; flex-direction: column-reverse; gap: 4px; background: #333; padding: 6px; border-radius: 8px; }
  .meter i { width: 30px; height: 11px; background: #444; border-radius: 3px; }
  .meter i.on { background: #ff9d00; box-shadow: 0 0 6px #ff9d00; }
  .wait { font-size: 18px; background: #333; color: #555; padding: 6px 10px; border-radius: 8px; text-align: center; }
  .wait.on { color: #ffdd57; text-shadow: 0 0 8px #ffbb00; }
  .zebra { width: 100%; height: 74px; position: relative; border-radius: 10px; border: 6px solid #555;
    background: repeating-linear-gradient(90deg, #fff 0 22px, #555 22px 40px); }
  .zebra .kid { position: absolute; left: 2px; bottom: 2px; font-size: 50px; line-height: 1; transition: left 2.6s linear; }
  .zebra .kid.far { left: calc(100% - 56px); }
  .zebra .kid.walk { animation: hop .4s infinite; }

  /* でんしレンジ */
  .mwbox { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .mw { width: 260px; height: 160px; background: #e9e9e9; border-radius: 16px; display: flex; padding: 14px; gap: 12px; box-shadow: 0 6px 0 #bbb; }
  .mw .win { flex: 1; background: #2e2e2e; border-radius: 8px; display: flex; align-items: center; justify-content: center;
    font-size: 64px; transition: background .3s; position: relative; }
  .mw .win.hot { background: #ffcf6b; }
  .mw .win.hot span { animation: spin 1.2s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg) } }
  .mw .win .steam { position: absolute; top: 2px; font-size: 30px; animation: hop .8s infinite; }
  .mw .pnl { width: 74px; background: #ccc; border-radius: 6px; display: flex; flex-direction: column; align-items: center; padding-top: 10px; gap: 12px; }
  .dig { background: #1f3b2c; color: #7dffb0; font-family: monospace; font-size: 20px; padding: 2px 5px; border-radius: 4px; text-shadow: 0 0 6px #3fd07a; }
  .knob { width: 36px; height: 36px; border-radius: 50%; background: #aaa; border: 4px solid #888; }
  .foods { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: min(100%, 300px); }
  .foods button { font-size: 40px; padding: 4px 0; }

  /* ---------- リアクション ---------- */
  #fx { position: fixed; inset: 0; pointer-events: none; z-index: 20; }
  #fxdom { position: fixed; inset: 0; pointer-events: none; z-index: 21; overflow: hidden; }
  .parade { position: absolute; bottom: 8%; font-size: 70px; white-space: nowrap; animation: run 3.2s linear forwards; }
  .parade span { display: inline-block; animation: hop .5s infinite; }
  .parade span:nth-child(2n) { animation-delay: .25s; }
  @keyframes run { from { left: 100% } to { left: -120% } }
  .train { position: absolute; left: 0; bottom: calc(4% + 10px); font-size: 64px; line-height: 1; white-space: nowrap;
    animation: runL 3.4s linear forwards; }
  .train span { display: inline-block; animation: rattle .25s infinite alternate; }
  @keyframes rattle { to { transform: translateY(-2px) } }
  @keyframes runL { from { transform: translateX(100vw) } to { transform: translateX(-110%) } }
  .rail { position: absolute; left: 0; right: 0; bottom: 4%; height: 12px; animation: fadeio 3.4s forwards;
    background: linear-gradient(#777 0 3px, transparent 3px), repeating-linear-gradient(90deg, #8a5a2b 0 10px, transparent 10px 26px); }
  @keyframes fadeio { 0%,100% { opacity: 0 } 8%,92% { opacity: 1 } }

  /* じはんき・ガチャ */
  .vm { width: 250px; background: #e94b4b; border-radius: 16px; padding: 12px; box-shadow: 0 6px 0 #a92f2f; }
  .vm .rows { background: #fff; border-radius: 8px; display: grid; grid-template-columns: repeat(3, 1fr); padding: 4px; }
  .dk { border: none; background: none; font: inherit; color: #4a3b2a; display: flex; flex-direction: column; align-items: center; font-size: 36px; padding: 4px 0; line-height: 1.15; }
  .dk small { font-size: 13px; } .dk i { width: 22px; height: 8px; border-radius: 4px; background: #ddd; margin-top: 2px; }
  .dk.lit i { background: #3fd07a; box-shadow: 0 0 8px #3fd07a; }
  .vm .money { margin-top: 8px; background: #222; color: #ff6b6b; font-family: monospace; text-align: right; padding: 3px 10px; border-radius: 6px; font-size: 22px; }
  .vm .slot { margin-top: 8px; height: 64px; background: #2a2a2a; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 48px; overflow: hidden; }
  .drop { animation: drop .45s cubic-bezier(.5,0,1,1); }
  @keyframes drop { from { transform: translateY(-80px) } to { transform: none } }
  .gacha { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .gacha .dome { width: 170px; height: min(140px, 17vh); border-radius: 50% 50% 12px 12px; background: rgba(210,240,255,.9); border: 6px solid #ccc;
    font-size: 24px; display: flex; flex-wrap: wrap; align-content: flex-end; justify-content: center; padding: 10px; gap: 2px; overflow: hidden; }
  .gacha .dome.shake { animation: wiggle .2s 2; }
  .gacha .base { width: 170px; height: 60px; background: #ff8c42; border-radius: 0 0 12px 12px; position: relative; }
  .gacha .handle { position: absolute; left: 50%; top: 8px; width: 44px; height: 44px; margin-left: -22px; border-radius: 50%;
    background: #fff; border: 4px solid #ddd; font-size: 26px; color: #ff8c42; display: flex; align-items: center; justify-content: center; transition: transform .4s; }
  .gacha .out { position: absolute; right: -80px; top: -6px; font-size: 60px; }
  .gacha .out.roll { animation: rollout .6s ease-out; }
  @keyframes rollout { from { transform: translateX(-80px) rotate(-360deg); opacity: 0 } to { transform: none; opacity: 1 } }
  .gacha .turns { font-size: 18px; min-height: 24px; }
  .coinbtn { padding: 8px 20px; font-size: 20px; }

  /* シール */
  #bookBtn { position: absolute; top: calc(12px + var(--st)); right: 12px; border: none; border-radius: 999px; background: rgba(255,255,255,.85);
    font: inherit; font-size: 18px; padding: 8px 14px; box-shadow: 0 3px 0 rgba(0,0,0,.12); z-index: 30; color: #4a3b2a; }
  #bookBtn.bump { animation: pop2 .4s; }
  @keyframes pop2 { 50% { transform: scale(1.35) } }
  .flyer { position: fixed; font-size: 70px; z-index: 40; pointer-events: none;
    transition: transform .8s cubic-bezier(.5,-0.3,.6,1), opacity .8s; }
  .homebook { margin-top: 18px; width: 100%; max-width: 520px; border: none; border-radius: 26px; padding: 14px; font: inherit;
    font-size: 24px; background: #fff; color: #4a3b2a; box-shadow: 0 7px 0 rgba(0,0,0,.12); }
  .homebook:active { transform: translateY(5px); box-shadow: 0 2px 0 rgba(0,0,0,.12); }
  #book { padding: calc(64px + var(--st)) 14px calc(20px + var(--sb)); overflow-y: auto; background: #fff3c9; }
  #back2 { position: absolute; top: calc(12px + var(--st)); left: 12px; border: none; border-radius: 999px; background: #fff;
    font: inherit; font-size: 18px; padding: 10px 18px; box-shadow: 0 3px 0 rgba(0,0,0,.12); color: #4a3b2a; }
  #book h2 { margin: 0 0 4px; font-size: 30px; } #book p { margin: 0 0 14px; font-size: 18px; }
  .stickers { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; width: 100%; max-width: 520px; }
  .st { aspect-ratio: 1; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: clamp(34px, 10vw, 50px); position: relative; box-shadow: 0 4px 0 rgba(0,0,0,.08); border: 3px dashed #e5d4a1; }
  .st.got { border: 3px solid #ffd35c; } .st.no { color: #d8c99a; font-size: 28px; }
  .st b { position: absolute; right: -2px; bottom: -2px; background: #ff6b9a; color: #fff; font-size: 13px; border-radius: 999px; padding: 1px 7px; }
  .st.new { animation: pop2 .6s 2; }
  .pop { position: absolute; left: 50%; top: 40%; transform: translate(-50%,-50%); text-align: center;
    animation: pop 2.4s ease-out forwards; }
  .pop .e { font-size: 150px; line-height: 1; } .pop .t { font-size: 44px; color: #ff6b9a;
    -webkit-text-stroke: 2px #fff; paint-order: stroke; text-shadow: 0 4px 0 rgba(0,0,0,.12); }
  @keyframes pop { 0% { transform: translate(-50%,-50%) scale(0) rotate(-30deg) }
    25% { transform: translate(-50%,-50%) scale(1.25) rotate(10deg) }
    40% { transform: translate(-50%,-50%) scale(1) rotate(0) }
    85% { opacity: 1 } 100% { opacity: 0; transform: translate(-50%,-60%) scale(1) } }
  .rainbow { position: absolute; left: 50%; top: 52%; width: 120vmin; height: 120vmin; transform: translate(-50%,-50%);
    border-radius: 50%; clip-path: inset(0 0 50% 0);
    background: radial-gradient(circle, transparent 38%, #a06cff 38%, #a06cff 42%, #4d8bff 42%, #4d8bff 46%,
      #3fd07a 46%, #3fd07a 50%, #ffe14d 50%, #ffe14d 54%, #ffa23d 54%, #ffa23d 58%, #ff5a5a 58%, #ff5a5a 62%, transparent 62%);
    animation: rb 2.8s ease-out forwards; }
  @keyframes rb { 0% { opacity: 0; transform: translate(-50%,-50%) scale(.3) } 25% { opacity: .95; transform: translate(-50%,-50%) scale(1) }
    80% { opacity: .95 } 100% { opacity: 0 } }
  .float { position: absolute; font-size: 56px; animation: floatup 3s ease-out forwards; }

<script>
/* ===================== ユーティリティ ===================== */
const $ = s => document.querySelector(s);
const pick = a => a[Math.floor(Math.random() * a.length)];
const wait = ms => new Promise(r => setTimeout(r, ms));

/* ===================== おと ===================== */
let ac = null;
function audio() {
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
  } catch (e) { ac = null; }
  return ac;
}
function tone(freq, at, dur, type = 'sine', vol = 0.25, toFreq) {
  const c = audio(); if (!c) return;
  const t = c.currentTime + at, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (toFreq) o.frequency.exponentialRampToValueAtTime(toFreq, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
}
const SND = {
  pi()     { tone(2400, 0, .12, 'square', .12); },
  chin()   { tone(2093, 0, 1.2, 'triangle', .3); tone(3136, 0, .9, 'sine', .15); },
  pinpon() { tone(659, 0, .7, 'sine', .35); tone(523, .4, 1.1, 'sine', .35); },
  bus()    { tone(1318, 0, .35, 'sine', .3); tone(1046, .22, .7, 'sine', .3); },
  pon()    { tone(880, 0, 1.4, 'sine', .3); tone(1760, 0, .6, 'sine', .08); },
  tick()   { tone(1200, 0, .05, 'square', .06); },
  hum()    { tone(110, 0, 1.9, 'sawtooth', .05); tone(220, 0, 1.9, 'sine', .05); },
  piyo()   { for (let i = 0; i < 4; i++) { tone(2000, i * .32, .12, 'sine', .2, 2900); tone(2000, i * .32 + .14, .1, 'sine', .2, 2900); } },
  fanfare(){ [523, 659, 784, 1046].forEach((f, i) => tone(f, i * .1, i === 3 ? .5 : .14, 'triangle', .2)); },
  pop()    { tone(400, 0, .15, 'sine', .25, 900); },
};

/* ===================== こえ ===================== */
function say(text) {
  try {
    const s = window.speechSynthesis; if (!s) return;
    s.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP'; u.rate = 1.0; u.pitch = 1.35;
    const v = s.getVoices().find(v => v.lang && v.lang.startsWith('ja'));
    if (v) u.voice = v;
    s.speak(u);
  } catch (e) {}
}
try { speechSynthesis.getVoices(); } catch (e) {}

function buzz(ms = 30) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }

/* ===================== リアクション ===================== */
const cv = $('#fx'), cx = cv.getContext('2d'), dom = $('#fxdom');
let parts = [], looping = false;
function resize() { const d = devicePixelRatio || 1; cv.width = innerWidth * d; cv.height = innerHeight * d; cx.setTransform(d, 0, 0, d, 0, 0); }
addEventListener('resize', resize); resize();
const COLORS = ['#ff5a5a', '#ffa23d', '#ffe14d', '#3fd07a', '#4d8bff', '#a06cff', '#ff7ac8'];

function loop() {
  cx.clearRect(0, 0, innerWidth, innerHeight);
  parts = parts.filter(p => p.life > 0);
  for (const p of parts) {
    p.vy += p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life--;
    if (p.drag) { p.vx *= p.drag; p.vy *= p.drag; }
    cx.save(); cx.globalAlpha = Math.min(1, p.life / 25); cx.translate(p.x, p.y); cx.rotate(p.rot);
    if (p.kind === 'rect') { cx.fillStyle = p.c; cx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); }
    else if (p.kind === 'dot') { cx.fillStyle = p.c; cx.beginPath(); cx.arc(0, 0, p.s, 0, 7); cx.fill(); }
    else if (p.kind === 'bubble') { cx.strokeStyle = p.c; cx.lineWidth = 3; cx.fillStyle = 'rgba(255,255,255,.25)';
      cx.beginPath(); cx.arc(0, 0, p.s, 0, 7); cx.fill(); cx.stroke();
      cx.fillStyle = 'rgba(255,255,255,.8)'; cx.beginPath(); cx.arc(-p.s * .35, -p.s * .35, p.s * .2, 0, 7); cx.fill(); }
    else if (p.kind === 'text') { cx.font = p.s + 'px serif'; cx.textAlign = 'center'; cx.textBaseline = 'middle'; cx.fillText(p.t, 0, 0); }

function add(p) { parts.push(Object.assign({ vx: 0, vy: 0, g: 0, rot: 0, vr: 0, life: 150 }, p)); if (!looping) { looping = true; requestAnimationFrame(loop); } }
function domFx(html, cls, ms) { const d = document.createElement('div'); d.className = cls; d.innerHTML = html; dom.appendChild(d); setTimeout(() => d.remove(), ms); }

const ANIMALS = ['🐶', '🐱', '🐰', '🐻', '🐼', '🐨', '🐯', '🦁', '🐷', '🐸', '🐵', '🐧', '🐘', '🦒', '🐥'];
const YUMMY = ['🍓', '🍎', '🍌', '🍇', '🍑', '🍒', '🍩', '🍪', '🍭', '🍦'];
const CHEERS = ['すごーい！', 'やったね！', 'じょうず！', 'わーい！', 'できたね！'];

const REACTIONS = [
  function confetti() {
    for (let i = 0; i < 130; i++) add({ kind: 'rect', x: Math.random() * innerWidth, y: -20 - Math.random() * 200,
      vx: (Math.random() - .5) * 3, vy: 2 + Math.random() * 3, g: .04, s: 10 + Math.random() * 10,
      vr: (Math.random() - .5) * .3, c: pick(COLORS), life: 200 });
  },
  async function fireworks() {
    for (let k = 0; k < 4; k++) {
      const x = innerWidth * (.15 + Math.random() * .7), y = innerHeight * (.15 + Math.random() * .35), c = pick(COLORS);
      tone(180, 0, .35, 'sawtooth', .08, 60);
      for (let i = 0; i < 50; i++) { const a = i / 50 * Math.PI * 2, sp = 3 + Math.random() * 3;
        add({ kind: 'dot', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: .05, drag: .97, s: 4, c, life: 80 }); }
      await wait(380);
    }
  },
  function bubbles() {
    for (let i = 0; i < 28; i++) add({ kind: 'bubble', x: Math.random() * innerWidth, y: innerHeight + 30 + Math.random() * 300,
      vx: (Math.random() - .5) * .8, vy: -2 - Math.random() * 2, s: 14 + Math.random() * 26, c: pick(COLORS), life: 260 });
    for (let i = 0; i < 6; i++) setTimeout(SND.pop, 300 + i * 250);
  },
  function starRain() {
    const set = Math.random() < .5 ? ['⭐', '🌟', '✨'] : YUMMY;
    for (let i = 0; i < 40; i++) add({ kind: 'text', t: pick(set), x: Math.random() * innerWidth, y: -40 - Math.random() * 400,
      vy: 3 + Math.random() * 3, vr: (Math.random() - .5) * .1, s: 34 + Math.random() * 24, life: 230 });
  },
  function parade() {
    const a = []; for (let i = 0; i < 5; i++) a.push(pick(ANIMALS));
    domFx(a.map(e => `<span>${e}</span>`).join(''), 'parade', 3300);

  function train() {
    domFx('', 'rail', 3500);

    for (let i = 0; i < 6; i++) { tone(300, i * .25, .08, 'square', .06); tone(260, i * .25 + .1, .08, 'square', .06); }
  },
  function bigPop() {
    domFx(`<div class="e">${pick([...ANIMALS, '🎉', '🌈', '🎂', '🦄'])}</div><div class="t">${pick(CHEERS)}</div>`, 'pop', 2500);
  },
  function rainbow() {
    domFx('', 'rainbow', 2900);
    for (let i = 0; i < 10; i++) setTimeout(() => {
      const d = document.createElement('div'); d.className = 'float'; d.textContent = pick(['🎈', '❤️', '💛', '💚', '💙']);
      d.style.left = (5 + Math.random() * 85) + '%'; d.style.bottom = '-60px'; dom.appendChild(d); setTimeout(() => d.remove(), 3100);
    }, i * 120);
  },
];
function clearFx() { dom.innerHTML = ''; parts = []; document.querySelectorAll('.flyer').forEach(f => f.remove()); }

/* ===================== シールちょう ===================== */
const STICKERS = ['🐶','🐱','🐰','🐻','🐼','🐨','🦁','🐷','🐸','🐧','🐘','🦒','🦄','🦖','🐳','🦋',
                  '🍓','🍎','🍌','🍩','🍦','🌈','⭐','🚗','🚃','🚒','✈️','🚀','🎈','🎂','🌻','👑'];

const gotKinds = () => STICKERS.filter(s => book[s]).length;
function updateBookN() { $('#bookN').textContent = gotKinds(); }
let lastSticker = null;
function giveSticker() {
  // まだ持っていないシールが少し出やすい
  const missing = STICKERS.filter(s => !book[s]);
  const s = (missing.length && Math.random() < .6) ? pick(missing) : pick(STICKERS);
  const isNew = !book[s];
  book[s] = (book[s] || 0) + 1; lastSticker = s; saveBook();
  const f = document.createElement('div'); f.className = 'flyer'; f.textContent = s;
  f.style.left = (innerWidth / 2 - 35) + 'px'; f.style.top = (innerHeight * .45) + 'px';

  }, 900);
  setTimeout(() => { f.remove(); updateBookN(); const b = $('#bookBtn'); b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump');
    tone(1568, 0, .12, 'sine', .2); tone(2093, .1, .25, 'sine', .2); }, 1750);
  return isNew;
}
function showBook() {
  const g = $('#stickers'); g.innerHTML = '';

    const d = document.createElement('div');

    else { d.className = 'st no'; d.textContent = '？'; }
    d.addEventListener('click', () => { if (book[s]) { SND.pop(); d.classList.remove('new'); void d.offsetWidth; d.classList.add('new'); } });
    g.appendChild(d);
  });
  const n = gotKinds();
  $('#bookCount').textContent = n === STICKERS.length ? `ぜんぶ あつめたね！ 👑` : `${n} / ${STICKERS.length} しゅるい あつめたよ`;
  clearFx(); document.querySelectorAll('.screen').forEach(e => e.classList.remove('on')); $('#book').classList.add('on');
}

let lastR = -1, clears = 0;
// ひとつの あそびを さいごまで やったときだけ よぶ（ごほうび＋シール）
function celebrate() {
  clears++;
  SND.fanfare();
  if (clears % 10 === 0) {
    // 10かい できるごとに だいサービス
    REACTIONS[0](); REACTIONS[1]();
    domFx(`<div class="e">🏆</div><div class="t">${clears}かい できたね！</div>`, 'pop', 2500);
    say(`すごい！ ${clears}かい できたね！`);
  } else {
    let i; do { i = Math.floor(Math.random() * REACTIONS.length); } while (i === lastR);
    lastR = i; REACTIONS[i]();
  }
  giveSticker();
}

/* ===================== てじゅんの しくみ ===================== */
const disp = $('#display'), big = $('#big'), play = $('#play'), hintEl = $('#hint');
let cur = null, running = false, sid = 0;
const STOP = {};
// がめんを はなれたら とちゅうの しょりを とめる sleep
async function sleep(ms) { const s = sid; await wait(ms); if (s !== sid) throw STOP; }
function setBig(label, on = true) { big.textContent = label; big.classList.toggle('off', !on); }
function setHint(t) { hintEl.textContent = t; }
// つぎに おす ところを ひからせる
function guide(el) {
  document.querySelectorAll('.guide').forEach(e => e.classList.remove('guide'));
  if (el && el.classList.contains('many') && el.children.length) el = pick([...el.children]); // ならんでいる ものは どれか ひとつ

function shake(el) { el.classList.remove('wiggle'); void el.offsetWidth; el.classList.add('wiggle'); }
let lastNag = 0;
function nag() { // いま なにを すればいいか こえで おしえる（しつこくならないように）
  const now = Date.now(); if (now - lastNag < 2500 || !hintEl.textContent) return;
  lastNag = now; say(hintEl.textContent);
}
function run(fn) {
  if (running) return; running = true; const s = sid;
  Promise.resolve().then(fn).catch(e => { if (e !== STOP) console.error(e); }).finally(() => { if (s === sid) running = false; });
}
function onTap(el, fn) {

}
function btn(cls, html) { const b = document.createElement('button'); b.className = cls; b.innerHTML = html; return b; }

SND.coin = () => { tone(2600, 0, .07, 'square', .07); tone(3300, .05, .3, 'sine', .15); };

/* ===================== ボタンのしゅるい ===================== */
const GOODS = [['🍎', 'りんご', 100], ['🍌', 'バナナ', 100], ['🍓', 'いちご', 200],

const THEMES = [

        <div class="route" id="route"></div>
        <div class="road" id="road"><div class="scene">${sc}${sc}</div><span class="bs" id="bs"></span><span class="me"><span>🚌</span></span></div>
        <div class="sign" id="sign">つぎ とまります</div></div>`;
      setBig('とまります', false); setHint('');
      this.drive().catch(e => { if (e !== STOP) console.error(e); });
    },
    st(k = 0) { return STOPS[(this.i + k) % STOPS.length]; },
    async drive() {
      let passes = 0;
      while (true) {
        const st = this.st(); this.req = false;
        $('#nx').textContent = `${st[0]} ${st[1]}`;
        $('#route').innerHTML = [0, 1, 2, 3].map(k => { const s = this.st(k); return `<div class="${k ? '' : 'nx'}"><span>${s[0]}</span>${s[1]}</div>`; }).join('');
        $('#road').classList.remove('stop'); $('#bs').classList.remove('show');
        tone(784, 0, .25, 'sine', .2); tone(659, .25, .4, 'sine', .2);
        say(`つぎは、${st[1]}です`);
        setBig('とまります', true); setHint(`${st[1]}で おりるなら ボタンを おしてね`); guide(big);
        let t = 0; while (t < 7000 && !this.req) { await sleep(100); t += 100; }
        if (this.req) {
          passes = 0;
          await sleep(2500);
          $('#road').classList.add('stop'); $('#bs').textContent = '🚏' + st[0]; $('#bs').classList.add('show');
          SND.psh(); say(`${st[1]}です。 ごじょうしゃ ありがとうございました`);
          await sleep(1800); celebrate(); await sleep(3500);
          $('#sign').classList.remove('lit');
        } else {
          setBig('とまります', false); guide(null);
          if (++passes >= 2) { // だれも おさないときは しゅうてんで ひとやすみ
            $('#road').classList.add('stop'); say('しゅうてんです');
            setHint('また のるときは ボタンを おしてね'); this.phase = 'rest';
            setBig('のる', true); guide(big);
            while (this.phase === 'rest') await sleep(200);
            passes = 0;
          } else { say(`${st[1]}は つうかします`); await sleep(1800); }
        }
        this.i++;
        say('はっしゃします'); SND.psh(); await sleep(1500);
      }
    },
    async press() {
      if (this.phase === 'rest') { this.phase = ''; SND.pop(); return; }
      this.req = true; SND.bus(); $('#sign').classList.add('lit'); say('つぎ、とまります！');
      setBig('とまります', false); setHint(`${this.st()[1]}で とまるよ`); guide(null);
    } },

  /* ---------- エレベーター：かいの ボタン（または おおきい ボタン）を おすだけ ---------- */
  { id: 'elev', ico: '🛗', name: 'エレベーター', card: '#7d8ea3', bg: '#eef1f5', btn: '#ffb233', dark: '#c47e0c', floor: 1,
    init() {
      const f = FLOORS[this.floor];
      disp.innerHTML = `<div class="elev"><div class="ecol"><div class="ind"><span id="arr"></span><b id="fl">${this.floor}</b></div>
        <div class="cab" id="cab"><span class="ins" id="ins">${f[0]}</span><span class="nm" id="fnm">${f[1]}</span><div class="dl"></div><div class="dr"></div></div></div>
        <div class="panel many" id="pnl"></div></div>`;
      [5, 6, 3, 4, 1, 2].forEach(n => {
        const b = btn('fb', `${n}<small>${FLOORS[n][0]}</small>`); b.dataset.n = n;
        onTap(b, el => { if (n === this.floor) { shake(el); say(`ここが ${n}かい、${FLOORS[n][1]}だよ`); return; } return this.go(n); });
        $('#pnl').appendChild(b);
      });
      this.ready();
    },
    ready() { setBig('うごかす', true); setHint('いきたい かいを おしてね'); guide($('#pnl')); },
    async press() { let n; do { n = 1 + Math.floor(Math.random() * 6); } while (n === this.floor); return this.go(n); },
    async go(to) {
      document.querySelectorAll('.fb').forEach(b => b.classList.toggle('lit', +b.dataset.n === to));
      SND.pi(); say(`${to}かい、${FLOORS[to][1]}へ いくよ`);
      setBig('うごいてるよ', false); guide(null); setHint('');
      await sleep(500); $('#cab').classList.add('closed'); await sleep(900);
      const step = to > this.floor ? 1 : -1; $('#arr').textContent = step > 0 ? '▲' : '▼';
      while (this.floor !== to) {
        await sleep(700); this.floor += step; $('#fl').textContent = this.floor; SND.tick();
        $('#ins').textContent = FLOORS[this.floor][0]; $('#fnm').textContent = FLOORS[this.floor][1];
      }
      await sleep(400); SND.pon(); $('#arr').textContent = '';
      $('#cab').classList.remove('closed'); document.querySelectorAll('.fb').forEach(b => b.classList.remove('lit'));
      say(`${to}かい、${FLOORS[to][1]}です`);
      await sleep(1300); celebrate(); await sleep(2500); this.ready();
    } },

  /* ---------- しんごう：おす → まつ → あおで わたる ---------- */
  { id: 'sig', ico: '🚦', name: 'しんごう', card: '#f2b632', bg: '#fff6d8', btn: '#ffcc33', dark: '#c99a10', far: false,
    init() {
      disp.innerHTML = `<div class="cross"><div class="top"><div class="signal"><div class="r on">🧍</div><div class="g">🚶</div></div>
        <div class="side"><div class="meter" id="meter">${'<i></i>'.repeat(6)}</div><div class="wait" id="wt">おまちください</div></div></div>
        <div class="zebra"><span class="kid ${this.far ? 'far' : ''}" id="kid">🧒</span></div></div>`;
      this.toRed(false);
    },
    toRed(talk = true) {
      this.phase = 'red'; this.gen = (this.gen || 0) + 1;
      $('.signal .r').classList.add('on'); $('.signal .g').classList.remove('on', 'blink');
      if (talk) say('あかに なったよ。とまってね');
      setBig('おす', true); setHint('わたりたいときは ボタンを おしてね'); guide(big);
    },
    async press() {
      if (this.phase === 'red') {
        SND.pi(); $('#wt').classList.add('on'); say('おまちください');
        setBig('まってね', false); setHint('あおに なるまで まってね'); guide(null);
        const m = [...document.querySelectorAll('#meter i')]; m.forEach(i => i.classList.add('on'));
        for (let k = m.length - 1; k >= 0; k--) { await sleep(600); m[k].classList.remove('on'); }
        $('.signal .r').classList.remove('on'); $('.signal .g').classList.add('on'); $('#wt').classList.remove('on');
        SND.piyo(); say('あおに なったよ！ みぎと ひだりを みて、てを あげて わたろう');
        this.phase = 'green'; setBig('🙋 わたる', true); setHint('てを あげて わたろう'); guide(big);
        const g = this.gen; // しばらく わたらないと あかに もどる
        (async () => { await sleep(10000); if (this.gen === g && this.phase === 'green') {
          $('.signal .g').classList.add('blink'); await sleep(2000); if (this.gen === g && this.phase === 'green') this.toRed(); } })().catch(() => {});
      } else if (this.phase === 'green') {
        this.phase = 'walk'; setBig('わたってるよ', false); guide(null); setHint('');
        const kid = $('#kid'); kid.textContent = '🙋'; kid.classList.add('walk'); this.far = !this.far; kid.classList.toggle('far', this.far);
        SND.piyo(); await sleep(1300); SND.piyo(); await sleep(1400);
        kid.classList.remove('walk'); kid.textContent = '🧒'; say('じょうずに わたれたね！');
        await sleep(600); celebrate(); await sleep(1200);
        $('.signal .g').classList.add('blink'); await sleep(1800); this.toRed(false);
      }
    } },

  /* ---------- でんしレンジ：（たべものを えらんで）あたため → チン ---------- */
  { id: 'mw', ico: '🍱', name: 'でんしレンジ', card: '#e86a92', bg: '#ffe6ee', btn: '#ff6f9a', dark: '#c4426b',
    init() {
      this.f = null;
      disp.innerHTML = `<div class="mwbox"><div class="mw"><div class="win" id="win"><span>🍽️</span></div>
        <div class="pnl"><div class="dig" id="dig">0:00</div><div class="knob"></div></div></div><div class="foods many" id="foods"></div></div>`;
      MWFOODS.forEach(f => { const b = btn('tb', f[0]); onTap(b, el => this.choose(f, el)); $('#foods').appendChild(b); });
      setBig('あたため', true); setHint('たべものを えらんで あたため を おしてね'); guide($('#foods'));
    },
    choose(f) {
      this.f = f; SND.pop();
      $('#win').innerHTML = `<span>${f[0]}</span>`; $('#dig').textContent = '0:05'; say(`${f[1]}を いれたよ`);
      setHint('あたため を おしてね'); guide(big);
    },
    async press() {
      if (!this.f) { this.choose(pick(MWFOODS)); await sleep(800); }
      setBig('まってね', false); guide(null); setHint('できるまで まってね');
      $('#foods').classList.add('dim'); $('#win').classList.add('hot'); SND.pi(); say('ブーン');
      for (let s = 5; s > 0; s--) { if (s % 2) SND.hum(); $('#dig').textContent = `0:0${s}`; await sleep(1000); }
      $('#dig').textContent = '0:00'; $('#win').classList.remove('hot'); SND.chin();
      $('#win').innerHTML = `<span class="steam">♨️</span><span>${this.f[0]}</span>`;
      say(`チン！ ほかほかの ${this.f[1]}が できたよ`);
      await sleep(1200); celebrate(); await sleep(3000); this.init();
    } },

  /* ---------- じはんき：おかねを いれる → のみものを タッチ ---------- */
  { id: 'vm', ico: '🧃', name: 'じはんき', card: '#e94b4b', bg: '#ffe3e3', btn: '#4d8bff', dark: '#2f5fbf',
    init() {
      this.money = 0; this.phase = 'coin';
      disp.innerHTML = `<div class="vm"><div class="rows many" id="rows"></div><div class="money" id="money">0えん</div><div class="slot" id="slot"></div></div>`;
      DRINKS.forEach(d => { const b = btn('dk', `${d[0]}<small>100えん</small><i></i>`); onTap(b, el => this.buy(d, el)); $('#rows').appendChild(b); });
      this.refresh(); setBig('🪙 いれる', true); setHint('おかねを いれてね'); guide(big);
    },
    refresh() {
      $('#money').textContent = `${this.money}えん`;
      document.querySelectorAll('.dk').forEach(b => b.classList.toggle('lit', this.money >= 100));
    },
    async press() {
      this.money = 100; this.phase = 'buy'; SND.coin(); this.refresh(); say('チャリン！ のみものを えらんでね');
      setBig('🪙 いれる', false); setHint('ひかっている のみものを タッチしてね'); guide($('#rows'));
    },
    async buy(d, el) {
      if (this.phase !== 'buy') { shake(el); say('さきに おかねを いれてね'); guide(big); return; }
      this.phase = 'out'; this.money = 0; this.refresh(); guide(null); setHint('');
      SND.pi(); await sleep(500);
      $('#slot').innerHTML = `<span class="drop">${d[0]}</span>`; tone(120, 0, .3, 'square', .25, 45); tone(90, .08, .3, 'square', .2, 40);
      say(`ガコン！ ${d[1]}が でたよ`); await sleep(1300);
      domFx(`<div class="e">${d[0]}</div><div class="t">ごくごく！</div>`, 'pop', 2500);
      await sleep(800); celebrate(); await sleep(3000); this.init();
    } },

  /* ---------- ガチャ：まわす → カプセルを あける ---------- */
  { id: 'gacha', ico: GACHA_ICON, name: 'ガチャガチャ', card: '#ff8c42', bg: '#fff0e0', btn: '#3fd07a', dark: '#24914f',
    init() {
      this.phase = 'turn'; this.rot = this.rot || 0;
      disp.innerHTML = `<div class="gacha"><div class="dome" id="dome">🔴🟡🔵🟢🟣🟠🔵🔴</div>
        <div class="base"><div class="handle" id="handle">✚</div><span class="out" id="cap"></span></div></div>`;
      onTap($('#cap'), () => this.open());
      setBig('まわす', true); setHint('まわす を おしてね'); guide(big);
    },
    async press() {
      if (this.phase === 'open') return this.open();
      this.phase = 'wait'; setBig('まわす', false); guide(null); setHint('');
      SND.coin(); await sleep(400);
      for (let k = 0; k < 2; k++) {
        this.rot += 180; $('#handle').style.transform = `rotate(${this.rot}deg)`;
        $('#dome').classList.remove('shake'); void $('#dome').offsetWidth; $('#dome').classList.add('shake');
        tone(700, 0, .06, 'square', .1); tone(500, .12, .06, 'square', .1); tone(400, .24, .08, 'square', .1);
        say(k ? 'ガチャン！' : 'ガチャ'); await sleep(600);
      }
      const cap = $('#cap'); cap.textContent = pick(['🔴', '🟡', '🔵', '🟢', '🟣']); cap.classList.add('roll'); SND.pop();
      await sleep(600);
      this.phase = 'open'; setBig('あける', true); setHint('カプセルを あけよう'); guide(cap);
    },
    async open() {
      if (this.phase !== 'open') return;
      this.phase = 'done'; setBig('あける', false); guide(null); setHint('');
      const toy = pick([['🦖', 'きょうりゅう'], ['🚗', 'くるま'], ['🧸', 'くまのぬいぐるみ'], ['🤖', 'ロボット'], ['🚀', 'ロケット'], ['🦄', 'ユニコーン'], ['🚒', 'しょうぼうしゃ'], ['🐳', 'くじら']]);
      const el = $('#cap'); SND.pop(); el.classList.remove('roll'); void el.offsetWidth; el.textContent = toy[0]; el.classList.add('roll');
      say(`やったー！ ${toy[1]}だ！`); await sleep(800); celebrate(); await sleep(3000); this.init();
    } },
];

/* ===================== がめん ===================== */
const grid = $('#grid');
THEMES.forEach(t => {
  const b = document.createElement('button'); b.className = 'card'; b.style.background = t.card;
  b.innerHTML = `<span class="ico">${t.ico}</span><span class="nm">${t.name}</span>`;
  b.addEventListener('click', () => { audio(); SND.pop(); open(t); });
  grid.appendChild(b);
});

function open(t) {
  sid++; cur = t; running = false; t.phase = '';
  play.style.background = t.bg; big.style.setProperty('--btn', t.btn); big.style.setProperty('--dark', t.dark);
  clearFx(); document.querySelectorAll('.screen').forEach(e => e.classList.remove('on')); play.classList.add('on');
  t.init(); updateBookN();
}
function goHome() {
  sid++; try { speechSynthesis.cancel(); } catch (e) {}
  cur = null; running = false; guide(null); clearFx(); document.querySelectorAll('.screen').forEach(e => e.classList.remove('on')); $('#home').classList.add('on');
}
$('#back').addEventListener('click', goHome);
$('#back2').addEventListener('click', goHome);
$('#homeBook').addEventListener('click', () => { audio(); SND.pop(); showBook(); });
$('#bookBtn').addEventListener('click', () => { audio(); SND.pop(); sid++; cur = null; running = false; showBook(); });

big.addEventListener('pointerdown', e => { e.preventDefault(); big.classList.add('down'); });
['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => big.addEventListener(ev, () => big.classList.remove('down')));
big.addEventListener('click', () => {
  audio(); buzz();
  if (!cur) return;
  // いまは おせない → ゆれて「つぎに なにを するか」を おしえる
  if (running || big.classList.contains('off')) { shake(big); nag(); return; }
  run(() => cur.press());
});

document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());

/* ===================== アプリ化（オフライン対応） ===================== */
// アプリが裏に回ったら しゃべりを止める
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { try { speechSynthesis.cancel(); } catch (e) {} }
});
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
